# One object turns a registered bare metal server into a Kubernetes cluster.
apiVersion: metal.kube.farm/v1alpha1
kind: MetalCluster
metadata:
  name: r730
  namespace: metal
spec:
  host:
    # Selects any available BareMetalHost with this pool label, so the same
    # definition works against a pool of identical machines.
    pool: r730
    # Interface name as the node's OS enumerates it, from inspection data.
    bootInterface: enp129s0f1
  network:
    nodeIP: 192.168.120.70
    prefix: 24
    gateway: 192.168.120.1
    dnsServer: 192.168.120.1
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12
  kubernetes:
    version: v1.36.2
    nodeLabels:
      node.kubernetes.io/instance-type: r730
    imageURL: http://192.168.120.249:8080/CENTOS_10_NODE_IMAGE_K8S_v1.36.2.qcow2
    imageChecksum: a6ecbde797e3b5592b4e500b9f8b6bb12bfd4b9cf4ca67bef6c023b439698496
    imageChecksumType: sha256
    imageDiskFormat: qcow2
  cni:
    ciliumVersion: 1.20.1
  gpu:
    # Installs the NVIDIA kernel driver on the node before kubeadm. Scheduling
    # the card is left to whatever consumes the cluster.
    driverInstallerURL: http://192.168.120.249:8080/NVIDIA-Linux-x86_64-580.178.04.run
